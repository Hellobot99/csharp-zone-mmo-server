syntax = "proto3";

option csharp_namespace = "GameProto";

// ── Heartbeat (PacketType 0x0011 / 0x0012) ───────────────────────────────────

message Ping {}
message Pong {}

// ── Move (PacketType 0x0101 / 0x0102) ────────────────────────────────────────

message MoveRequest {
  float x = 1;
  float y = 2;
  float z = 3;
}

message MoveResponse {
  int32 player_id = 1;
  float x         = 2;
  float y         = 3;
  float z         = 4;
}

// ── Chat (PacketType 0x0201 / 0x0202) ────────────────────────────────────────

message ChatRequest {
  string message = 1;
}

message ChatBroadcast {
  int32  player_id = 1;
  string username  = 2;
  string message   = 3;
}
